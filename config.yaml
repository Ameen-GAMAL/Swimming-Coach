video:
  fps_override: null          # Leave null to read fps from the file

pool:
  length_m: 50            # corrected from 25 (user-confirmed): this is a 50m competition pool. The old value was a second, independent scale error sitting underneath the calibration bug -- calibrate.py derives its length axis as pool_length_m * correction, so every distance was additionally halved relative to the intended premise.
  lanes: 6
  lane_width_m: 2.5           # FINA standard lane width, needed for the calibration homography
  segment_size_m: 2.5         # Size of each grid strip drawn on the video
  clean_zone_start_m: 5       # Skip the dive and the push-off
  clean_zone_end_m: 20        # Skip the approach to the wall
  min_turn_swing_m: 8.0       # How far the smoothed position must swing back before a turn is believed. Previously this borrowed lane_width_m (2.5) -- a LATERAL measure used as a longitudinal test, and far too small: measured on a real track, position jitter reached 1.6m between consecutive frames, so 2.5m of "swing" was ordinary noise and one ~25m traverse was chopped into 7 bogus "lengths" (one of them 2.6m in 0.13s). At 8.0m that same track resolves to a single length. Should scale with length_m if the pool ever changes.

calibration:
  # Automatic calibration (no clicking -- see CLAUDE.md section 3 amendment).
  # Water-colour thresholds (HSV) for finding the pool; tune these if the
  # water mask misses the pool or picks up sky/buildings in different footage.
  water_hue_min: 75
  water_hue_max: 100
  water_sat_min: 60
  water_value_min: 180
  water_search_top_frac: 0.45     # ignore this top fraction of the frame -- pool is always lower, this avoids blue building trim
  lane_far_edge_gap_fraction: 1.0 # the lane's far edge is approximated as this fraction of the remaining gap to the frame's bottom edge, since only one rope is reliably detectable

  # Length-scale estimate from the swimmer's own body size (no wall visible
  # in this footage -- see CLAUDE.md section 3 amendment). Sampled and
  # filtered heavily because the pretrained detector/pose model are both
  # unreliable on this footage, and a handful of bad keypoint reads can
  # throw the whole estimate off by several times if not filtered out.
  scale_estimate_num_samples: 250     # frames spread across the video to attempt
  scale_estimate_min_keypoint_conf: 0.30  # matches pose.conf_threshold -- the pixel-sanity floor below is what actually catches bad keypoint reads here, not confidence (a bad reading can still score high confidence)
  scale_estimate_min_torso_px: 40     # below this, a shoulder/hip reading is almost certainly a bad keypoint, not a real torso. Only used by the superseded torso-based estimator.
  assumed_swimmer_box_length_m: 2.5   # what a side-on swimmer's DETECTION BOX spans along the pool axis: body (~1.8m) plus the forward arm reach of a stroking freestyler. This single number sets every distance and speed downstream, and it is an assumption, not a measurement -- good to roughly +/-15-20% because the reach varies through the stroke cycle. It replaced a shoulder-to-hip torso reading, which on this footage collapsed to ~60px on a swimmer spanning ~1040px and drove the calibration ~4x long.
  scale_estimate_min_box_px: 200      # ignore boxes too small to be a real side-on swimmer at this camera range -- distant lanes and partial detections would otherwise bias the median
  scale_estimate_min_samples: 6        # fail loudly rather than trust a scale built from a handful of samples
  visible_span_bounds_m: [3.0, 60.0]  # how much pool LENGTH the camera can plausibly see, in metres. Replaces length_scale_clamp_ratio ([0.7, 1.6] x pool.length_m), which assumed the detected rope span was roughly the whole pool -- false here, where the camera sits at water level and sees a short stretch. Measured on DIVE_P023 that clamp forced a 40m span when the truth is under 10m, making the homography call every swimmer 8.5-11.4m long and every speed ~5.7x too slow, with the correct value unreachable by a factor of 2.5. These bounds only reject the physically absurd; the anthropometric estimate decides within them, and calibrate.py prints the implied swimmer body length as a sanity check.

pool_area_margin_m: 3.0       # allowed slack around the calibrated pool area before a detection is discarded as outside the pool -- generous because the automatic calibration's lane-width edge is itself a heuristic (see CLAUDE.md section 3 amendment), not a click-verified boundary

tracking:
  # ByteTrack settings (matches the fixed decision: Tracker = ByteTrack).
  # Values are the library's own defaults, made visible here so they're tunable.
  track_high_thresh: 0.25     # first-stage match threshold; raise for cleaner tracks, lower to keep more
  track_low_thresh: 0.10      # second-stage threshold for low-score matches
  new_track_thresh: 0.25      # start a new track if no match scores at least this
  track_buffer: 30            # frames to keep a lost track alive before dropping it
  match_thresh: 0.80          # association similarity threshold (IoU-based)
  fuse_score: true            # combine detection confidence with motion/IoU when matching
  id_reuse_max_gap_sec: 2.0   # if a track ends and a new one starts within this long, treat it as the same swimmer (dataset is single-swimmer, single-lane trials -- see data/candidates.md)
  min_segment_frames_for_merge: 5  # a track-ID segment shorter than this doesn't anchor the merge chain -- measured on real footage: 74% of all segments are exactly 1 frame (noise blips, often a YOLO box and a colour-fusion box of the same swimmer that didn't overlap enough to count as one detection), and letting them anchor the chain caused spurious time-overlaps that kept resetting it instead of bridging real gaps. See detect_track.py's merge_continuous_tracks.
  max_overlap_frames_for_merge: 50   # two substantial segments overlapping in time by up to this many frames may still be merged, if their mean positions agree (see max_merge_distance_m) -- measured on real footage: this is usually ByteTrack briefly double-tracking the same swimmer during an ID handoff, not a second object
  max_merge_distance_m: 3.0          # how close two segments' mean positions must be to treat a time-overlap as the same swimmer, not a genuinely different concurrent object -- a bit more than one lane width (2.5m) to allow for position noise

camera_motion:
  # The available footage uses a camera that pans/tracks the swimmer (see
  # CLAUDE.md section 3 amendment), so every frame's own motion must be
  # measured and corrected before comparing pixel positions to the
  # calibration, which was done on one fixed reference frame.
  background_region_frac: 0.35   # FLOOR, not a fixed value -- detect_track.py's dynamic_background_region_frac raises this per-clip using the calibration's own pool-top boundary, never shrinks below this. A fixed fraction doesn't generalize: measured on real footage, this default was fine for DIVE_P010 (stands fill that band) but captured almost nothing but plain sky for DIVE_P023 (stands sit lower in that clip's framing), giving zero matched ORB features in 63% of frames -- see CLAUDE.md section 3 amendment.
  min_good_features: 40          # below this many matched background features, the motion estimate for that frame is not trusted
  orb_features: 1200             # ORB keypoints per frame
  match_resize_width: 1600       # background region is shrunk to this width before ORB runs, for speed
  ratio_test_threshold: 0.75     # Lowe's ratio test cutoff for a "good" feature match, before RANSAC

  # Keyframe anchoring for the motion chain. The anchor frame is HELD for
  # many frames instead of advancing every frame: at 120fps the background
  # moves 0.15-0.25px per frame, ~20x below findHomography's 4px RANSAC
  # threshold, so per-frame steps all came back as identity and composing
  # them threw away ~97% of the real camera pan (measured on DIVE_P023:
  # 25px reported vs ~750px actual across frames 722-4178). Since the
  # camera pans to keep the swimmer centred, that transform carries
  # essentially all of the swimmer's real-world motion -- losing it made
  # every length/speed/cycle number downstream meaningless.
  keyframe_reanchor_displacement_px: 60   # promote a new keyframe once the view has moved this far from the current one -- 15x the RANSAC threshold, so the composed step is well clear of the noise floor (measured: a 60px shift takes ~200 frames at this clip's pan rate, and still leaves ~590 inliers)
  keyframe_max_interval_frames: 240       # hard cap (2s at 120fps) so a static camera still re-anchors occasionally rather than matching against an ever-older frame
  keyframe_min_interval_frames: 30        # don't let the inlier-floor rule re-anchor faster than this -- below ~30 frames the motion is back under the RANSAC threshold and we'd be re-creating the per-frame bug
  keyframe_reanchor_inlier_floor: 150     # re-anchor early when matching starts degrading, well before min_good_features (40) would fail the frame outright

  # Motion-based swimmer localization -- fixes the root cause behind most
  # other problems (weak pretrained "person" detection on swimmers, see
  # CLAUDE.md section 3 amendment): after motion-compensating two
  # consecutive frames into the same reference alignment, the water
  # background nearly cancels out and the swimmer is the one large,
  # coherent region of real change. Used to confirm/supplement YOLO,
  # not replace it -- YOLO's own detections are always trusted first.
  motion_fusion_enabled: false    # OFF -- see CLAUDE.md section 3 amendment. Measured on real footage: whole-crop background subtraction is consistently won by near-field ripple/glint noise and lane-rope texture (both closer to this low, wide-angle camera than the swimmer, so they show larger frame-to-frame pixel displacement); a local-window variant anchored to each track's last position self-reinforces onto a wrong static feature once the seed position is off. Code kept (and the camera-motion alignment fix below is a real improvement over the old fixed-reference-window bug) so a future, better-verified swimmer-localization signal (e.g. colour/appearance-based, not motion-based) can reuse the plumbing without re-deriving it.
  motion_detect_width: 1600       # pool-area crop is warped to this width for the diff -- needs to stay high enough that the swimmer survives as a multi-pixel blob after morphological cleanup (measured: 640 shrank the swimmer to a few px and lost them behind noise almost every frame)
  motion_diff_threshold: 25       # pixel intensity difference to count as "changed" between aligned frames
  motion_min_area_frac: 0.001     # a blob smaller than this fraction of the crop is noise, not the swimmer
  motion_max_area_frac: 0.5       # a blob larger than this is a lighting/alignment glitch, not the swimmer
  motion_yolo_iou_match: 0.1      # if a YOLO box overlaps the motion blob at least this much, trust YOLO's and don't synthesize one
  motion_synthetic_confidence: 0.5  # placeholder confidence given to a detection synthesized from the motion blob (matches roughly track_high_thresh, so ByteTrack treats it as a solid detection)

color_localize:
  # Colour-based swimmer localization -- the fix that replaced motion-based
  # detection above (see CLAUDE.md section 3 amendment). Per frame, not
  # temporal: the swimmer's skin/dark cap/white splash foam differ in hue
  # from the pool's turquoise water (reusing calibration's own water HSV
  # thresholds below), and this doesn't depend on frame-to-frame camera-
  # motion alignment at all, sidestepping the near-field parallax/glint
  # problem that broke the motion approach. Validated by visual spot-check
  # on real footage: every sampled detection landed on/at the swimmer, once
  # candidates were restricted to be near the actual water body (see
  # near_water_margin_px below) -- without that restriction, warm-toned
  # background objects (e.g. a building facade) were occasionally
  # misflagged as skin-hue. Recall is modest (roughly a quarter of frames
  # in the tested slice), which is fine for a signal meant to supplement
  # YOLO, not replace it -- the swimmer is only clearly visible (not
  # submerged) part of the time anyway.
  #
  # OFF as of the camera-motion fix. This was added to rescue a weak
  # pretrained detector, but it synthesises a detection whenever the colour
  # blob finds no overlapping YOLO box -- and a STATIC object matching the
  # skin/cap thresholds then gets a synthetic detection every single frame.
  # Being motionless, it never loses tracking, so it outranks the real
  # swimmer: measured on DIVE_P023 it produced a 1576-frame "track" (every
  # row scored exactly synthetic_confidence) of something that never moved,
  # while the real swimmer's track fragmented around it. With the fine-tuned
  # detector at ~99% hit rate the rescue is not needed, and turning this off
  # also cut tracks-before-merge from 103 to 79 on the same clip.
  enabled: false
  downscale_width: 1280           # frame is shrunk to about this width before HSV thresholding, for speed (measured: full-res ~71ms/frame vs ~8ms/frame at this size)
  search_top_frac: 0.35           # same idea as camera_motion.background_region_frac -- skip the sky/stands strip, never the pool
  search_bottom_margin_frac: 0.15 # also skip the nearest-camera water strip -- measured to carry the worst ripple/glint clutter
  skin_hue_max: 30                # OpenCV H (0-179): skin tone / dark cap sits low; pool water sits much higher (see calibration.water_hue_* below) -- measured on real footage: swimmer samples read H~11-14, water H~86-93
  white_splash_sat_max: 15        # white splash foam: low saturation
  white_splash_value_min: 210     # ...and high brightness
  near_water_margin_px: 14        # in the DOWNSCALED frame's own pixels -- a candidate must be within this margin of the main water body to count, which is what excludes background objects that are also skin-hue by colour but aren't near the pool at all
  body_height_pad_multiplier: 2.5 # the raw colour blob (skin/splash) is usually much shorter than a full swimmer body -- pad its height by this factor (centred, so its centre point/real-world position is unchanged) so it overlaps ByteTrack's predicted full-body box well enough to extend a track, and gives pose.py's crop enough of the body to find keypoints in. Measured on real footage: colour-blob median height ~36px vs YOLO's own swimmer-box median height ~89px, ratio ~2.5
  min_area_frac: 0.0002           # fraction of the search region's area
  max_area_frac: 0.01
  morph_kernel: 3
  yolo_iou_match: 0.1             # if a YOLO box overlaps the colour blob at least this much, trust YOLO's and don't synthesize one
  synthetic_confidence: 0.5       # placeholder confidence given to a detection synthesized from the colour blob

detection:
  model: yolo11x_swimmer_finetuned_v1.pt  # yolo11x fine-tuned on 196 hand-reviewed frames from 8 training clips. Measured on the 4 clips held out of training entirely (P010/P023/P007/P027): hit rate 66.2% -> 99.4%, mean confidence 0.219 -> 0.302, consistent across all four. Previously plain yolo11x.pt, itself an upgrade over yolo11m.pt. NOTE: *.pt is gitignored, so a fresh clone will not have this file -- rebuild it with scripts/finetune_train.py (then copy best.pt to this name at the project root), or set this back to yolo11x.pt to run on the pretrained detector.
  # Low on purpose: ByteTrack is designed to use low-confidence detections
  # for track recovery (its own track_high_thresh/track_low_thresh below do
  # that filtering), so this should sit at or below track_low_thresh, not
  # act as the final confidence gate. Measured on real footage: the
  # pretrained "person" class is weak on swimmers (horizontal, partly
  # submerged, unusual angle vs COCO's mostly-upright training data) --
  # median top confidence per frame was only ~0.13 with yolo11m. See
  # CLAUDE.md section 3 amendment notes / Phase 4 report for the measurement.
  conf_threshold: 0.10
  batch_size: 16
  half_precision: true

pose:
  model: yolo11m-pose.pt
  conf_threshold: 0.30
  batch_size: 16
  half_precision: true

events:
  wrist_conf_threshold: 0.40
  min_cycle_seconds: 0.6      # Anything faster than this is noise
  smoothing_window: 5         # Frames, to steady the wrist signal
  confidence_drop_window_frames: 15  # how many frames after a crossing to look for the confidence dip/rise that confirms it
  crossing_hysteresis_frac: 0.15  # a crossing of the shoulder line only counts once the wrist travels this fraction of the signal's own 10-90 percentile spread clear of it. Scaled from the signal rather than fixed in pixels so it follows the swimmer through perspective; without it, keypoint jitter around the line produced about twice as many raw crossings as real strokes.
  max_sample_gap_frames: 15   # two pose samples further apart than this (0.125s at 120fps) are not treated as a crossing: pose emits no row when a crop yields no person, so consecutive ROWS can sit a second or more apart, and a flip across that gap was never observed -- only inferred from missing data
  min_track_frames_for_analysis: 60  # tracks shorter than this can't show even one full stroke cycle -- skip rather than produce a near-empty plot

quality:
  min_confidence: 0.90
  min_valid_cycles: 1  # relaxed from 3, by explicit user request, after measuring that neither available test clip ever contains 2 consecutive hand-entries in one continuously-tracked window -- the clip length runs out (or tracking drops) mid-cycle every time. Below this count, stroke_rate_cpm/distance_per_cycle_m are blanked with a data_quality_note explaining why (see metrics.py's apply_quality_gate); speed/clean-swim-time are position-based and are not gated on cycle count at all -- see CLAUDE.md section 8.5 amendment.
  max_plausible_speed_ms: 3.0  # generously above elite freestyle (~2.2-2.5 m/s) -- a "length" whose implied speed exceeds this is turn-detection noise (a spurious zigzag from position jitter/a tracking discontinuity), not a real swim; rejected outright rather than reported as a partial observation. Needed once partial clean-zone coverage was accepted (see above): the old full-15m-crossing requirement filtered these out implicitly, since noise essentially never spans the whole clean zone.

benchmarks:
  provisional: true           # These are placeholder numbers, not real data
  freestyle:
    stroke_rate_50m: [55, 70]   # cycles per minute
    stroke_rate_100m: [45, 60]
    distance_per_cycle: [1.8, 2.5]   # metres

render:
  # OpenCV's VideoWriter on this machine has no working H.264 encoder
  # (OpenH264 DLL missing) and falls back to a poorly-compressed codec --
  # writing at full 4K source resolution produced a 2.3GB file for a 45s
  # clip. Downscaling before writing is the reliable, dependency-free fix.
  output_max_width: 1920
  output_fps: 30               # the fixed "every frame" decision is about analysis, not the review video -- writing at the source's ~120fps produces a huge file for no visual benefit

mlflow:
  tracking_uri: "file:./mlruns"
  experiment_name: "swimming-poc"

cache:
  enabled: true
  directory: "./cache"
